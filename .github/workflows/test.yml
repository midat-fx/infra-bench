# Manual only: a full run takes ~15 minutes of runner time.
name: make test
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: make-test
  cancel-in-progress: false # never kill a half-built cluster run

jobs:
  make-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: make test
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: results
          path: results/validate-*
          retention-days: 30
