# A full run takes ~15 minutes of runner time: weekly, and by hand.
# `ids` narrows a manual run to some scenarios while one is being written.
name: make test
on:
  schedule:
    - cron: "17 4 * * 1" # Mondays 04:17 UTC
  workflow_dispatch:
    inputs:
      ids:
        description: scenario IDs, space-separated; empty runs all
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: make-test
  cancel-in-progress: false # never kill a half-built cluster run

jobs:
  make-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Through env, not ${{ }} in the script: the input is free text.
      # Make pastes IDS into the recipe, so allow only scenario-ID characters.
      - run: |
          [[ "$IDS" =~ ^[a-z0-9\ -]*$ ]] || { echo "bad ids: $IDS"; exit 1; }
          make test IDS="$IDS"
        env:
          IDS: ${{ inputs.ids }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: results
          path: results/validate-*
          retention-days: 30
