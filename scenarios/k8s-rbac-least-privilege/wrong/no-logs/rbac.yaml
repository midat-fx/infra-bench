apiVersion: v1
kind: ServiceAccount
metadata:
  name: log-shipper
  namespace: k8s-rbac-least-privilege
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: log-reader
  namespace: k8s-rbac-least-privilege
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: log-shipper
  namespace: k8s-rbac-least-privilege
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: log-reader
subjects:
  - kind: ServiceAccount
    name: log-shipper
    namespace: k8s-rbac-least-privilege
