apiVersion: v1
kind: ServiceAccount
metadata:
  name: log-shipper
  namespace: k8s-rbac-least-privilege
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: log-reader
  labels:
    bench: k8s-rbac-least-privilege
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: log-shipper
  labels:
    bench: k8s-rbac-least-privilege
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: log-reader
subjects:
  - kind: ServiceAccount
    name: log-shipper
    namespace: k8s-rbac-least-privilege
