apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: k8s-service-selector
spec:
  replicas: 2
  selector:
    matchLabels: {app: shop, component: web}
  template:
    metadata:
      labels: {app: shop, component: web, version: v2}
    spec:
      terminationGracePeriodSeconds: 1
      containers:
        - name: web
          image: busybox:1.37.0@sha256:a7dbc319b1438115a207e11930dc4bb3e643dcb3ec0bdd694bb36cd8fad289ec
          command: ["sh", "-c", "mkdir -p /www && echo web > /www/index.html && exec httpd -f -p 8080 -h /www"]
          ports:
            - containerPort: 8080
---
# Internal back-office UI. Must never be reachable through the public Service.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: admin
  namespace: k8s-service-selector
spec:
  replicas: 1
  selector:
    matchLabels: {app: shop, component: admin}
  template:
    metadata:
      labels: {app: shop, component: admin, version: v2}
    spec:
      terminationGracePeriodSeconds: 1
      containers:
        - name: admin
          image: busybox:1.37.0@sha256:a7dbc319b1438115a207e11930dc4bb3e643dcb3ec0bdd694bb36cd8fad289ec
          command: ["sh", "-c", "mkdir -p /www && echo admin > /www/index.html && exec httpd -f -p 8080 -h /www"]
          ports:
            - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: shop-public
  namespace: k8s-service-selector
spec:
  selector: {app: shop, component: web, version: v2}
  ports:
    - port: 80
      targetPort: 8080
