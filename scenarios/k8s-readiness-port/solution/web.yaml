apiVersion: apps/v1
kind: Deployment
metadata:
  name: storefront
  namespace: k8s-readiness-port
spec:
  replicas: 2
  selector:
    matchLabels:
      app: storefront
  template:
    metadata:
      labels:
        app: storefront
    spec:
      terminationGracePeriodSeconds: 2
      containers:
        - name: web
          image: busybox:1.37.0@sha256:a7dbc319b1438115a207e11930dc4bb3e643dcb3ec0bdd694bb36cd8fad289ec
          command: ["sh", "-c"]
          args:
            - |
              mkdir -p /www && echo ok > /www/healthz && echo storefront > /www/index.html
              exec httpd -f -p 8080 -h /www
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 2
            failureThreshold: 2
---
apiVersion: v1
kind: Service
metadata:
  name: storefront
  namespace: k8s-readiness-port
spec:
  selector:
    app: storefront
  ports:
    - port: 80
      targetPort: http
